<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scrap Heap browser worker</title>
    <style>
      body { color: #e8edf2; background: #101820; font: 16px system-ui, sans-serif; margin: 2rem; }
      canvas { display: block; width: min(90vw, 900px); height: auto; border: 1px solid #64748b; }
      pre { white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <h1>Scrap Heap browser worker</h1>
    <p>This page connects to the Go coordinator, computes assigned tiles with WASM, and displays tiles accepted from this browser.</p>
    <p><button id="download" disabled>Download PNG</button></p>
    <canvas id="image" width="2048" height="2048"></canvas>
    <pre id="status">Loading WASM and connecting to the coordinator…</pre>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
